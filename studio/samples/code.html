<dialog id="sample-code-dialog" aria-labelledby="sample-code-title">
  <button type="button" class="sample-close" aria-label="Close sample code">×</button>
  <h2 id="sample-code-title">Your sample code</h2>
  <p>Enter the personal code Sam sent you to unlock your free sample checkout.</p>
  <form>
    <label for="sample-code">Personal sample code</label>
    <input id="sample-code" name="code" required maxlength="128" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SABI-XXXXX-XXXXX-XXXXX-XXXXX">
    <p role="status" aria-live="polite"></p>
    <button type="submit" class="button">Use my code</button>
  </form>
  <p class="field-help">One item per person. One sample of each product. Item and delivery: £0.</p>
</dialog>
