[build]
  command = "corepack enable && pnpm --dir career-partner-onboarding install --frozen-lockfile && pnpm --dir career-partner-onboarding run build"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
